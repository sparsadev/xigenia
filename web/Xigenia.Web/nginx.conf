server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WebAssembly SPA fallback — serve index.html for client-side routes
    # such as /login, /accounts, /dashboard that have no corresponding static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static framework assets aggressively; hashed filenames allow long TTL.
    location /_framework/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Do not cache index.html — ensure new deployments are picked up promptly.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
    gzip_vary on;
}
