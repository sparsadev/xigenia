name: xigenia-deploy

# Production deployment topology for VM 149 (prometheus.sparsa.dev — 192.168.10.149):
#   Cloudflare Tunnel -> Vega Nginx Proxy Manager -> VM 149
#   Web  : https://xigenia.sparsa.dev      -> host 8080 -> container 80
#   API  : https://api.xigenia.sparsa.dev  -> host 8081 -> container 8080
#
# SQL Server runs separately on Antares; no database container is defined here.
# Secrets are injected at runtime from an untracked .env.deploy file (see .env.deploy.example).
# This file is standalone — it does not extend docker-compose.yml.

services:
  api:
    build:
      context: .
      dockerfile: src/Xigenia.Api/Dockerfile
    image: xigenia-api:deploy
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Ai__Provider: Meta
      Cors__AllowedOrigins__0: https://xigenia.sparsa.dev
      # Runtime-injected secrets — fail fast if not supplied via .env.deploy
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Set ConnectionStrings__DefaultConnection in .env.deploy (see .env.deploy.example)}
      MetaAi__ApiKey: ${MetaAi__ApiKey:?Set MetaAi__ApiKey in .env.deploy — use a real Meta key or leave validated empty handling}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Xigenia.Web/Dockerfile
      args:
        API_BASE_URL: https://api.xigenia.sparsa.dev
    image: xigenia-web:deploy
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
